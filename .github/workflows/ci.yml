name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Run ruff check
        run: ruff check backend frontend

      - name: Run ruff format check
        run: ruff format --check backend frontend
        continue-on-error: true

  import-check:
    name: Import smoke test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import backend modules without secrets
        env:
          LLM_PROVIDER: HUGGINGFACE_API
          EMBEDDING_PROVIDER: HUGGINGFACE_API
          RERANK_PROVIDER: HUGGINGFACE_API
          VERIFICATION_PROVIDER: HUGGINGFACE_API
          VECTOR_STORE: PINECONE
          SPARSE_RETRIEVAL: "false"
          HF_TOKEN: ""
          PINECONE_API_KEY: ""
          PINECONE_INDEX: ci-smoke
        run: |
          python - <<'PY'
          import importlib
          for mod in [
              "backend.config",
              "backend.models",
              "backend.document_parser",
              "backend.chunker",
              "backend.embeddings",
              "backend.llm",
              "backend.hf_api",
              "backend.hybrid_search",
              "backend.mmr",
              "backend.query_rewriter",
              "backend.intent_classifier",
              "backend.task_prompts",
              "backend.context_compressor",
              "backend.validators",
              "backend.cache",
              "backend.verification",
              "backend.faithfulness",
              "backend.agent",
              "backend.main",
          ]:
              importlib.import_module(mod)
              print(f"OK  {mod}")
          PY

  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            dockerfile: Dockerfile.backend
          - service: frontend
            dockerfile: Dockerfile.frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: rag-pipeline-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  notify-render:
    name: Notify (Render auto-deploys on push)
    runs-on: ubuntu-latest
    needs: [import-check, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Render auto-deploys this commit
        run: |
          echo "Render web services watch this repository and redeploy automatically on every push to main."
          echo "If RENDER_DEPLOY_HOOK_BACKEND or RENDER_DEPLOY_HOOK_FRONTEND secrets are set, this step will trigger them."
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}" ]; then
            curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}" && echo "backend deploy hook fired"
          fi
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}" ]; then
            curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}" && echo "frontend deploy hook fired"
          fi
