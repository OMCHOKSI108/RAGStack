[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    ".venv",
    "evaluation_output",
    "data",
    "index",
    "models",
    "docs",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names, etc.)
    "W",   # pycodestyle warnings
    "I",   # isort (import order)
    "B",   # flake8-bugbear (likely bugs)
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (covered by formatter; many existing long lines)
    "E402",  # module-level import not at top (intentional in some adapters)
    "B008",  # function call in default argument (FastAPI/Depends pattern)
    "B904",  # raise ... from err (style, not safety)
    "UP007", # Use X | Y for type hints (we still support older typing)
]

[tool.ruff.lint.per-file-ignores]
"test.py" = ["F841", "B007"]
"backend/__init__.py" = ["F401"]
"frontend/__init__.py" = ["F401"]
